<!DOCTYPE html>
<!--
  ============================================================================
  admin.html — RSVP dashboard
  ============================================================================
  This page (and everything under /admin) is only reachable after the
  browser's basic-auth prompt succeeds — see adminAuth.js, which
  server.js applies to the /admin path before this file is ever served.

  It fetches its data from GET /api/admin/rsvps (routes-admin.js), which is
  protected by the same middleware.

  LANGUAGE: this page has no ES/EN toggle of its own — it reads whichever
  language was last picked on the public site (localStorage key
  'site-language', set by main.js) and renders in that language. See the
  top of admin.js for how that's applied. If the couple never visited the
  public site in this browser, it defaults to Spanish.
  ============================================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Ismeraí &amp; Jesús</title>
  <link rel="icon" type="image/png" href="/favicon-32.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body class="admin-body">

  <div class="admin-ribbon">
    <img src="/monogram.png" alt="I &amp; J" />
  </div>

  <div class="admin-content">

  <header class="admin-header">
    <h1 data-i18n="admin_title">RSVP</h1>
  </header>

  <!-- Wraps the action buttons + stat cards together so desktop can lay
       them out side by side (stats left, buttons right — see
       .admin-toolbar in admin.css) while mobile keeps them stacked in
       their original order (actions, then stats) via the `order`
       property rather than needing a different DOM order per
       breakpoint. -->
  <div class="admin-toolbar">
    <div class="admin-header__actions">
      <a href="/" class="btn admin-icon-btn admin-home-btn" data-i18n-label="admin_home_btn" aria-label="Back to homepage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9" /><path d="M10 20v-6h4v6" /></svg>
      </a>
      <a href="/api/admin/rsvps/export" class="btn admin-icon-btn admin-export-btn" id="export-btn" data-i18n-label="admin_export_btn" aria-label="Download Excel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11" /><path d="M7.5 11 12 15.5 16.5 11" /><path d="M4.5 18.5v1.5a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-1.5" /></svg>
      </a>
      <button id="refresh-btn" class="btn btn--primary admin-icon-btn" data-i18n-label="admin_refresh_btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 0 1 14.5-4.5M20 4v5.5h-5.5" /><path d="M20 14a8 8 0 0 1-14.5 4.5M4 20v-5.5h5.5" /></svg>
      </button>
    </div>

    <section class="admin-summary" id="admin-summary">
      <div class="admin-stat">
        <span class="admin-stat__number" id="stat-attending">–</span>
        <span class="admin-stat__label" data-i18n="admin_stat_attending">Invitaciones confirmadas</span>
      </div>
      <div class="admin-stat">
        <span class="admin-stat__number" id="stat-declined">–</span>
        <span class="admin-stat__label" data-i18n="admin_stat_declined">Invitaciones declinadas</span>
      </div>
      <div class="admin-stat">
        <span class="admin-stat__number" id="stat-guests">–</span>
        <span class="admin-stat__label" data-i18n="admin_stat_guests">Total de asistentes</span>
      </div>
    </section>
  </div>

  <p class="admin-scroll-hint" data-i18n="admin_scroll_hint">Swipe left/right to see more columns →</p>

  <section class="admin-table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th data-i18n="admin_th_name">Name</th>
          <th data-i18n="admin_th_phone">Phone</th>
          <th data-i18n="admin_th_attending">Attending</th>
          <th data-i18n="admin_th_guests">Guests</th>
          <th data-i18n="admin_th_song">Song</th>
          <th data-i18n="admin_th_message">Message</th>
          <th data-i18n="admin_th_submitted">Submitted</th>
          <th data-i18n="admin_th_actions">Actions</th>
        </tr>
      </thead>
      <tbody id="admin-table-body">
        <tr><td colspan="8">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  </div>
  <!-- /.admin-content -->

  <!-- Reusable popup for the full text of a truncated message cell (see
       admin.js's setupMessagePopup) — one element, JS moves/fills it and
       toggles .is-open rather than creating a new one per row. -->
  <div class="admin-message-popup" id="message-popup" role="tooltip"></div>

  <!-- i18n.js must load before admin.js, which reads window.DICTIONARY. -->
  <script src="/i18n.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
